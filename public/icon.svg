<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="charGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1493" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="#38bdf8" stroke-width="8" opacity="0.3" />
  <!-- Voxel Character Silhouette -->
  <rect x="206" y="140" width="100" height="90" rx="16" fill="url(#charGrad)" stroke="#ffffff" stroke-width="8" />
  <circle cx="236" cy="180" r="10" fill="#ffffff" />
  <circle cx="276" cy="180" r="10" fill="#ffffff" />
  <rect x="186" y="240" width="140" height="110" rx="18" fill="#38bdf8" stroke="#ffffff" stroke-width="8" />
  <!-- Floating Letter -->
  <rect x="340" y="120" width="80" height="80" rx="16" fill="#fbbf24" stroke="#ffffff" stroke-width="6" />
  <text x="380" y="175" font-size="52" font-family="Arial, sans-serif" font-weight="900" fill="#1e1b4b" text-anchor="middle">A</text>
</svg>
